# Deploy the security-headers Worker from the CLI instead of the dashboard.
#
#   npm i -g wrangler        # if not installed
#   wrangler login           # opens browser to authorize (your Cloudflare account)
#   wrangler deploy          # from the repo root
#
# The route below only serves once the domain's A records are Proxied
# (orange cloud) in Cloudflare DNS, with SSL/TLS mode set to "Full".

name = "add-security-headers"
main = "workers/add-security-headers.js"
compatibility_date = "2026-08-15"

routes = [
  { pattern = "nohairhomecare.com/*", zone_name = "nohairhomecare.com" }
]
